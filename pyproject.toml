[project]
name = "any-ocr-service"
version = "0.4.0"
description = "多格式 → Markdown 转换服务（PDF OCR + anydoc Office 引擎，RapidOCR + llama-server VLM）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Wang Bo" }]
dependencies = [
    "pymupdf>=1.24",
    "rapidocr-onnxruntime>=1.4",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "requests>=2.31",
    "pillow>=10.0",
    "python-multipart>=0.0.9",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "firecrawl-anydoc>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
anyocr = "anyocr.cli:main"
anyocr-api = "anyocr.api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anyocr"]

[tool.uv]
package = true

[tool.ruff]
line-length = 120
